<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Mr. Wok — Carta</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{touch-action:manipulation}
#viewer{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,177.7777778vh);height:min(56.25vw,100vh);aspect-ratio:16/9;overflow:hidden;background:#000}
#slide{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;display:block;z-index:10;cursor:pointer}
#fs{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:30;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.48);color:#fff;font-size:22px}
#home{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:30;border:0;border-radius:22px;padding:9px 14px;background:rgba(0,0,0,.48);color:#fff;font-size:13px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:16px system-ui;background:#000;z-index:100}
</style>
</head>
<body>
<div id="loading">Cargando carta…</div>
<div id="viewer">
  <div id="stage">
    <img id="slide" alt="Carta Mr. Wok" draggable="false">
  </div>
  <button id="fs" aria-label="Pantalla completa">⛶</button>
  <button id="home" aria-label="Volver al inicio">Inicio</button>
</div>
<script>
const DATA={"count": 14, "links": {"1": [{"x": 44.11458, "y": 10.0, "w": 40.625, "h": 72.22222, "target": 2}], "2": [{"x": 7.38189, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 1}], "3": [{"x": 7.3894, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 2}], "4": [{"x": 7.38189, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 2}], "5": [{"x": 7.38189, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 2}, {"x": 81.20079, "y": 39.50131, "w": 11.81102, "h": 20.99738, "target": 6}, {"x": 8.85827, "y": 10.49869, "w": 5.90551, "h": 10.49869, "target": 2}], "6": [{"x": 7.38189, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 5}, {"x": 81.20079, "y": 39.50131, "w": 11.81102, "h": 20.99738, "target": 7}, {"x": 8.85827, "y": 10.49869, "w": 5.90551, "h": 10.49869, "target": 2}], "7": [{"x": 7.38189, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 6}, {"x": 8.85827, "y": 10.49869, "w": 5.90551, "h": 10.49869, "target": 2}], "8": [{"x": 26.40625, "y": 32.77778, "w": 17.71654, "h": 31.49606, "target": 9}, {"x": 55.87723, "y": 32.77778, "w": 17.71654, "h": 31.49606, "target": 12}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "9": [{"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 10}, {"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 11}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "10": [{"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 9}, {"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 11}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "11": [{"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 9}, {"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 10}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "12": [{"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 13}, {"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 14}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "13": [{"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 14}, {"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 12}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "14": [{"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 12}, {"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 13}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}]}};
const stage=document.getElementById('stage');
const img=document.getElementById('slide');
const loading=document.getElementById('loading');
let n=1;

function getSlideFromHash(){
  const raw=location.hash.replace('#','').trim();
  const v=parseInt(raw,10);
  return Number.isFinite(v)&&v>=1&&v<=DATA.count?v:1;
}

function go(target){
  n=Math.max(1,Math.min(DATA.count,target));
  history.replaceState(null,'','#'+n);
  render();
}

function render(){
  document.querySelectorAll('.hot').forEach(e=>e.remove());
  img.src='slides/'+n+'.png';

  const zones=DATA.links[n]||[];
  zones.forEach(z=>{
    const a=document.createElement('a');
    a.className='hot';
    a.href='#'+z.target;
    a.setAttribute('aria-label','Ir a página '+z.target);
    a.style.left=z.x+'%';
    a.style.top=z.y+'%';
    a.style.width=z.w+'%';
    a.style.height=z.h+'%';
    a.addEventListener('click',e=>{e.preventDefault();go(z.target);});
    stage.appendChild(a);
  });
}

img.addEventListener('load',()=>{loading.style.display='none';});
window.addEventListener('hashchange',()=>{n=getSlideFromHash();render();});

document.getElementById('home').addEventListener('click',()=>go(1));
document.getElementById('fs').addEventListener('click',async()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
});

// Swipe navigation as an additional fallback.
let touchX=0,touchY=0;
stage.addEventListener('touchstart',e=>{
  const t=e.changedTouches[0]; touchX=t.clientX; touchY=t.clientY;
},{passive:true});
stage.addEventListener('touchend',e=>{
  const t=e.changedTouches[0], dx=t.clientX-touchX, dy=t.clientY-touchY;
  if(Math.abs(dx)>80 && Math.abs(dx)>Math.abs(dy)){
    go(n+(dx<0?1:-1));
  }
},{passive:true});

n=getSlideFromHash();
render();
</script>
</body>
</html>
