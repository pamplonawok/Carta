<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>Mr. Wok — Carta</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{touch-action:none}
#viewer{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,177.7777778vh);height:min(56.25vw,100vh);aspect-ratio:16/9;overflow:hidden;background:#000}
#slide{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#touch{position:absolute;inset:0;z-index:10;touch-action:none}
#fs{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:30;width:44px;height:44px;border:0;border-radius:50%;background:#0008;color:#fff;font-size:22px}
#home{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:30;border:0;border-radius:22px;padding:9px 14px;background:#0008;color:#fff;font-size:13px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#000;z-index:100;font:16px system-ui}
</style>
</head>
<body>
<div id="loading">Cargando carta…</div>
<div id="viewer">
  <div id="stage">
    <img id="slide" alt="Carta Mr. Wok" draggable="false">
    <div id="touch" aria-label="Navegación de la carta"></div>
  </div>
  <button id="fs" aria-label="Pantalla completa">⛶</button>
  <button id="home">Inicio</button>
</div>
<script>
const DATA={"count": 14, "links": {"1": [{"x": 44.11458, "y": 10.0, "w": 40.625, "h": 72.22222, "target": 2}], "2": [{"x": 7.38189, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 1}], "3": [{"x": 7.3894, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 2}], "4": [{"x": 7.38189, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 2}], "5": [{"x": 7.38189, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 2}, {"x": 81.20079, "y": 39.50131, "w": 11.81102, "h": 20.99738, "target": 6}, {"x": 8.85827, "y": 10.49869, "w": 5.90551, "h": 10.49869, "target": 2}], "6": [{"x": 7.38189, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 5}, {"x": 81.20079, "y": 39.50131, "w": 11.81102, "h": 20.99738, "target": 7}, {"x": 8.85827, "y": 10.49869, "w": 5.90551, "h": 10.49869, "target": 2}], "7": [{"x": 7.38189, "y": 39.58005, "w": 11.81102, "h": 20.99738, "target": 6}, {"x": 8.85827, "y": 10.49869, "w": 5.90551, "h": 10.49869, "target": 2}], "8": [{"x": 26.40625, "y": 32.77778, "w": 17.71654, "h": 31.49606, "target": 9}, {"x": 55.87723, "y": 32.77778, "w": 17.71654, "h": 31.49606, "target": 12}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "9": [{"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 10}, {"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 11}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "10": [{"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 9}, {"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 11}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "11": [{"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 9}, {"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 10}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "12": [{"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 13}, {"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 14}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "13": [{"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 14}, {"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 12}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}], "14": [{"x": 4.42913, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 12}, {"x": 85.62992, "y": 7.87402, "w": 9.89583, "h": 17.59259, "target": 13}, {"x": 18.45554, "y": 7.87402, "w": 5.90551, "h": 10.49869, "target": 2}]}};
const stage=document.getElementById('stage');
const img=document.getElementById('slide');
const touch=document.getElementById('touch');
const loading=document.getElementById('loading');
let n=1;

function current(){
  const v=parseInt(location.hash.slice(1),10);
  return Number.isFinite(v)&&v>=1&&v<=DATA.count?v:1;
}
function render(){
  n=current();
  img.src='slides/'+n+'.png';
}
function go(target){
  if(target<1||target>DATA.count)return;
  n=target;
  history.replaceState(null,'','#'+n);
  render();
}
img.onload=()=>loading.style.display='none';
window.addEventListener('hashchange',()=>{n=current();render();});

// One robust pointer handler over the whole slide.
// It uses the original PowerPoint link rectangles as percentages,
// so mobile browser click/anchor behavior cannot interfere.
touch.addEventListener('pointerup',e=>{
  const r=stage.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*100;
  const y=(e.clientY-r.top)/r.height*100;
  const zones=DATA.links[n]||[];
  const hit=zones.find(z=>x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h);
  if(hit){e.preventDefault();e.stopPropagation();go(hit.target);}
},{passive:false});

// Swipe navigation fallback.
let sx=0,sy=0;
touch.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;},{passive:true});
touch.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy))go(n+(dx<0?1:-1));
},{passive:true});

document.getElementById('home').onclick=()=>go(1);
document.getElementById('fs').onclick=async()=>{
 try{
   if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
   else await document.exitFullscreen();
 }catch(e){}
};
n=current();render();
</script>
</body>
</html>
