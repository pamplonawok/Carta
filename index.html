<style>

#page{position:relative;max-width:100vw;max-height:100vh;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#slide{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}

#fs{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:20;border:0;border-radius:22px;width:44px;height:44px;background:rgba(0,0,0,.48);color:#fff;font-size:22px}
#home{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;border:0;border-radius:22px;padding:10px 14px;background:rgba(0,0,0,.48);color:#fff;font-size:13px}
</style>
</head>
<body>
<div id="viewer">
 <div id="page"><img id="slide" draggable="false"></div>

const img=document.getElementById('slide');
const page=document.getElementById('page');
let n=Number(location.hash.slice(1))||1;

function render(){
 n=Math.min(DATA.count,Math.max(1,n));
 img.src='slides/'+n+'.png';
 document.querySelectorAll('.hot').forEach(e=>e.remove());
 const rect=img.getBoundingClientRect();
 const pageRect=page.getBoundingClientRect();
 const sx=rect.width, sy=rect.height;
 const links=DATA.links[n]||[];
 links.forEach(l=>{
   const a=document.createElement('a');
   a.className='hot';
   a.href='#'+l.target;
   a.style.left=(rect.left-pageRect.left+l.x*img.naturalWidth*(rect.width/img.naturalWidth))+'px';
   a.style.top=(rect.top-pageRect.top+l.y*img.naturalHeight*(rect.height/img.naturalHeight))+'px';
   a.style.width=(l.w*img.naturalWidth*(rect.width/img.naturalWidth))+'px';
   a.style.height=(l.h*img.naturalHeight*(rect.height/img.naturalHeight))+'px';
   a.onclick=e=>{e.preventDefault();n=l.target;location.hash=n;render()};
   page.appendChild(a);
 });
}
img.onload=render;
window.onhashchange=()=>{n=Number(location.hash.slice(1))||1;render()};
document.getElementById('home').onclick=()=>{n=1;location.hash='1';render()};
document.getElementById('fs').onclick=async()=>{
 try{
  if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
 }catch(e){}
};
let sx=0;
document.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-sx;
 if(Math.abs(dx)>70){n=Math.min(DATA.count,Math.max(1,n+(dx<0?1:-1)));location.hash=n;render();}
},{passive:true});
