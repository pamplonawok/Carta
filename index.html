    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body {
      touch-action: manipulation;
      font-family: Arial, sans-serif;
    }
    #viewer {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: min(100vw, 177.7777778vh);
      height: min(56.25vw, 100vh);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }
    #slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .hotspot {
      position: absolute;
      z-index: 10;
      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      display: block;
    }
    #fullscreen {
      position: fixed;
      right: 10px;
      top: max(10px, env(safe-area-inset-top));
      z-index: 50;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 22px;
    }
    #home {
      position: fixed;
      left: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 50;
      border: 0;
      border-radius: 22px;
      padding: 9px 15px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 13px;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
    }
  </style>

    const stage = document.getElementById("stage");
    const slide = document.getElementById("slide");
    const loading = document.getElementById("loading");

    let currentSlide = 1;

    function readSlide() {
      const value = Number.parseInt(window.location.hash.substring(1), 10);
      if (Number.isInteger(value) && value >= 1 && value <= DATA.count) {
        return value;
      }
      return 1;
    }

    function goTo(number) {
      const target = Math.max(1, Math.min(DATA.count, number));
      currentSlide = target;
      window.history.replaceState(null, "", "#" + target);
      draw();
    }

    function draw() {
      currentSlide = readSlide();

      document.querySelectorAll(".hotspot").forEach((element) => element.remove());

      slide.src = "slides/" + currentSlide + ".png";

      const links = DATA.links[String(currentSlide)] || [];

      links.forEach((link) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "hotspot";
        button.setAttribute("aria-label", "Ir a página " + link.target);

        button.style.left = link.x + "%";
        button.style.top = link.y + "%";
        button.style.width = link.w + "%";
        button.style.height = link.h + "%";

        button.addEventListener("click", function(event) {
          event.preventDefault();
          event.stopPropagation();
          goTo(link.target);
        });

        stage.appendChild(button);
      });
    }

    slide.addEventListener("load", function() {
      loading.style.display = "none";
    });

    window.addEventListener("hashchange", draw);

    document.getElementById("home").addEventListener("click", function() {
      goTo(1);
    });

    document.getElementById("fullscreen").addEventListener("click", async function() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        // Algunos móviles no permiten fullscreen desde el navegador.
      }
    });

    // Deslizar también permite cambiar de página.
    let startX = 0;
    let startY = 0;

    stage.addEventListener("touchstart", function(event) {
      const touch = event.changedTouches[0];
      startX = touch.clientX;
      startY = touch.clientY;
    }, { passive: true });

    stage.addEventListener("touchend", function(event) {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;

      if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy)) {
        goTo(currentSlide + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    currentSlide = readSlide();
    draw();
